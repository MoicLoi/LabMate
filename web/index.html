<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta name="format-detection" content="telephone=no">
<title>实验智记 LabMate</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5.2L5.4 17a2 2 0 0 0 1.8 3h9.6a2 2 0 0 0 1.8-3L14 8.2V3"/><path d="M6.6 14h10.8"/></svg>
      </span>
      <div class="brand-txt">
        <h1 id="title">实验智记</h1>
        <p id="subtitle">LabMate · 轻量实验助手</p>
      </div>
    </div>
    <div class="top-actions" id="topActions"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="lab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16"/><path d="M4 12h10"/><path d="M4 18.5h7"/><circle cx="18" cy="12" r="2.2"/><circle cx="15" cy="18.5" r="2.2"/></svg>
      <span>实验</span>
    </button>
    <button class="tab" data-tab="capture">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.2-2h5l1.2 2h1.8A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
      <span>识别入库</span>
    </button>
    <button class="tab" data-tab="branches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="18" cy="12" r="2.2"/><circle cx="6" cy="19" r="2.2"/><path d="M8.2 5h3.3a3 3 0 0 1 3 3v1.8"/><path d="M8.2 19h3.3a3 3 0 0 0 3-3v-1.8"/></svg>
      <span>分支</span>
    </button>
    <button class="tab" data-tab="formula">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h9"/><path d="M9.5 5l-4 14"/><path d="M14 9.5c3 0 5 1.4 5 3.4 0 2.2-2 3.6-5 3.6"/><path d="M8.6 13h4.6"/></svg>
      <span>公式</span>
    </button>
    <button class="tab" data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      <span>更多</span>
    </button>
  </nav>
</div>

<div id="sheet" class="sheet hidden" aria-hidden="true">
  <div class="sheet-mask" data-act="close-sheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="modal-mask" data-act="close-modal"></div>
  <div class="modal-card" id="modalBody" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="toast" role="status"></div>

<input type="file" id="photoInput" accept="image/*" class="hidden">
<input type="file" id="jsonInput" accept=".json,application/json" class="hidden">

<script src="js/latex.js"></script>
<script src="js/seeds.js"></script>
<script src="js/core.js"></script>
<script src="js/ai.js"></script>
<script src="js/domain.js"></script>
<script src="js/app.js"></script>
</body>
</html>
